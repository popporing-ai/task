services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task1234
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  task:
    build: .
    ports:
      - "3004:3004"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: task
      DB_USER: task
      DB_PASSWORD: task1234
      PORT: 3004
      # 로컬/사내 LLM 연동 (.env 파일에서 주입, 미설정 시 AI 요약만 비활성)
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL:   ${LLM_MODEL:-llama3.1:8b}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      # host.docker.internal로 호스트(서버) 위 LLM 접근
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - virnect-net

volumes:
  pgdata:

networks:
  virnect-net:
    external: true
