version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task1234
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"

  task:
    build: .
    ports:
      - "3004:3004"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: task
      DB_USER: task
      DB_PASSWORD: task1234
      PORT: 3004
    depends_on:
      - db

volumes:
  pgdata:
