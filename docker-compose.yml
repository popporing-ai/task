services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task1234
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  task:
    build: .
    ports:
      - "3004:3004"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: task
      DB_USER: task
      DB_PASSWORD: task1234
      PORT: 3004
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    networks:
      - default
      - virnect-net

volumes:
  pgdata:

networks:
  virnect-net:
    external: true
