<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마케팅 업무 현황</title>
  <base href="/task/">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">
        <span class="sb-logo-badge">M</span>
        <div>
          <div class="sb-logo-title">마케팅 업무 현황</div>
          <div class="sb-logo-sub">VIRNECT 마케팅팀</div>
        </div>
      </div>
    </div>

    <nav class="sb-nav">
      <a class="nav-item active" data-view="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
        대시보드
      </a>

      <div class="nav-section">업무 관리</div>
      <a class="nav-item" data-view="tasks">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        업무 현황
      </a>
      <a class="nav-item" data-view="timeline">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        연간 타임라인
      </a>

      <div class="nav-section">콘텐츠</div>
      <a class="nav-item" data-view="content">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M1 5h14" stroke="currentColor" stroke-width="1.4"/><path d="M5 5v10" stroke="currentColor" stroke-width="1.4"/></svg>
        콘텐츠 캘린더
      </a>

      <div class="nav-section">캘린더</div>
      <a class="nav-item" data-view="calendar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M1 6h14M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        팀 캘린더
      </a>

      <div class="nav-section">팀</div>
      <a class="nav-item" data-view="weekly-report">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 14V8h3v6H2zM6.5 14V5h3v9h-3zM11 14V2h3v12h-3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        팀 활동
      </a>
      <a class="nav-item" data-view="rrr">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        R&R 현황
      </a>
      <div class="nav-section">설정</div>
      <a class="nav-item" data-view="settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 10a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor" stroke-width="1.4"/><path d="M13.5 8a5.5 5.5 0 01-.5 2.3l1.2 1.2-1.4 1.4-1.2-1.2A5.5 5.5 0 018 13.5a5.5 5.5 0 01-2.3-.5l-1.2 1.2-1.4-1.4 1.2-1.2A5.5 5.5 0 012.5 8c0-.8.2-1.6.5-2.3L1.8 4.5l1.4-1.4 1.2 1.2A5.5 5.5 0 018 2.5c.8 0 1.6.2 2.3.5l1.2-1.2 1.4 1.4-1.2 1.2c.3.7.5 1.5.5 2.3z" stroke="currentColor" stroke-width="1.4"/></svg>
        설정
      </a>

      <div class="nav-section nav-admin-only" style="display:none">관리</div>
      <a class="nav-item nav-admin-only" data-view="audit" style="display:none">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 9h6M5 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        변경 이력
      </a>
      <a class="nav-item nav-admin-only" data-view="bulk-delete" style="display:none">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V3a1 1 0 011-1h2a1 1 0 011 1v1m2 0v9a1 1 0 01-1 1H5a1 1 0 01-1-1V4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7v5M9 7v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        대량 삭제
      </a>
    </nav>

    <!-- 버전 라벨 (클릭 시 전체 릴리즈 노트) -->
    <button class="sb-version" id="sb-version" title="릴리즈 노트 보기">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span id="sb-version-text">v—</span>
    </button>

    <!-- 현재 사용자 -->
    <div class="sb-user" id="sb-user">
      <div class="sb-user-info">
        <span class="avatar" id="sb-avatar"></span>
        <span class="sb-user-name" id="sb-user-name"></span>
      </div>
      <button class="sb-logout" id="btn-logout">로그아웃</button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-breadcrumb" id="topbar-title">
        <span class="topbar-breadcrumb-root">마케팅 업무 현황</span>
        <span class="topbar-breadcrumb-sep">›</span>
        <span class="topbar-breadcrumb-current" id="topbar-current">대시보드</span>
      </div>
      <div class="topbar-center">
        <div class="global-search-wrap" id="global-search-wrap">
          <input type="text" class="global-search" id="global-search" placeholder="검색..." autocomplete="off">
          <span class="search-shortcut-hint" id="search-hint">Ctrl+K</span>
          <div class="search-results" id="search-results" style="display:none;"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions" id="topbar-actions"></div>
        <div class="topbar-notifications" id="notif-wrap">
          <button class="notif-bell" id="notif-bell" title="알림">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 1.5a4 4 0 014 4v2.5l1.5 2H2.5L4 8V5.5a4 4 0 014-4z" stroke="currentColor" stroke-width="1.3"/><path d="M6 12a2 2 0 004 0" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="notif-badge" id="notif-badge" style="display:none">0</span>
          </button>
          <div class="notif-dropdown" id="notif-dropdown" style="display:none">
            <div class="notif-header">
              <span>알림</span>
              <button class="notif-read-all" id="notif-read-all">모두 읽음</button>
            </div>
            <div class="notif-list" id="notif-list"></div>
          </div>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <!-- 슬라이드 패널 -->
  <div class="overlay" id="overlay" style="display:none"></div>
  <div class="slide-panel" id="slide-panel">
    <div class="panel-header">
      <h2 class="panel-title" id="panel-title"></h2>
      <button class="panel-share" id="panel-share" title="이 항목 링크 복사" style="display:none">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 2.5a2 2 0 11.7 1.55L6.95 6.45a2 2 0 010 3.1l3.75 2.4A2 2 0 1110 13.5a2 2 0 01.3-1.05L6.55 10.05a2 2 0 110-4.1L10.3 3.55A2 2 0 0110 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer">
      <button class="btn btn-default" id="panel-cancel">취소</button>
      <button class="btn btn-primary" id="panel-save">저장</button>
    </div>
  </div>

  <!-- 확인 다이얼로그 -->
  <div class="dialog-overlay" id="dialog-overlay" style="display:none">
    <div class="dialog">
      <p class="dialog-msg" id="dialog-msg"></p>
      <div class="dialog-actions">
        <button class="btn btn-default" id="dialog-cancel">취소</button>
        <button class="btn btn-danger" id="dialog-confirm">삭제</button>
      </div>
    </div>
  </div>

  <!-- 슬랙형 알림 팝업 컨테이너 -->
  <div id="notif-popup-container"></div>

  <script src="js/api.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/timeline.js"></script>
  <script src="js/views/content.js"></script>
  <script src="js/views/rrr.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/audit.js"></script>
  <script src="js/views/admin-bulk.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/weekly_report.js"></script>
  <script src="js/chat_widget.js"></script>
  <script src="js/release_notes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
