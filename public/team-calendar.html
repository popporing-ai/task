<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>VIRNECT 마케팅팀 캘린더</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --color-primary: #4F6EF7;
      --color-bg-primary: #FFFFFF;
      --color-bg-secondary: #F7F8FA;
      --color-border: #E5E8EB;
      --color-text-primary: #191F28;
      --color-text-secondary: #4E5968;
      --color-text-muted: #6B7684;
      --color-text-hint: #8B95A1;
      --main-bg: #F2F4F6;
      --shadow-sm: 0 2px 10px rgba(17,24,28,0.07), 0 0 0 1px rgba(17,24,28,0.04);
      --shadow-md: 0 6px 20px rgba(17,24,28,0.10), 0 2px 6px rgba(17,24,28,0.05);
      --shadow-lg: 0 16px 48px rgba(17,24,28,0.14), 0 6px 16px rgba(17,24,28,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--main-bg);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      padding: 24px;
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }

    /* 헤더 */
    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }
    .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .page-title .accent { color: var(--color-primary); }
    .page-sub { font-size: 13px; color: var(--color-text-muted); margin-top: 4px; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: #1E883B;
      background: #E6F4EA; padding: 6px 12px; border-radius: 999px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #1E883B;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* 네비게이션 바 */
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
    }
    .cal-nav-left { display: flex; align-items: center; gap: 8px; }
    .cal-nav-title { font-size: 17px; font-weight: 700; min-width: 130px; text-align: center; }
    .nav-btn {
      width: 34px; height: 34px; border: 0.5px solid var(--color-border);
      background: var(--color-bg-primary); border-radius: 9px; cursor: pointer;
      font-size: 15px; color: var(--color-text-secondary); transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: var(--color-bg-secondary); border-color: #D1D6DB; }
    .today-btn { width: auto; padding: 0 14px; font-size: 13px; font-weight: 600; margin-left: 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* 월간 그리드 */
    .calendar-grid {
      background: var(--color-bg-primary); border: 0.5px solid var(--color-border);
      border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--color-bg-secondary); border-bottom: 0.5px solid var(--color-border); }
    .calendar-header-cell { padding: 10px 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--color-text-muted); }
    .calendar-header-cell.sun { color: #F07070; }
    .calendar-header-cell.sat { color: #7B9BFA; }
    .calendar-body { display: flex; flex-direction: column; }
    .calendar-week { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 0.5px solid var(--color-border); }
    .calendar-week:last-child { border-bottom: none; }
    .calendar-day { min-height: 104px; padding: 6px 8px; border-right: 0.5px solid var(--color-border); position: relative; }
    .calendar-day:last-child { border-right: none; }
    .calendar-day.today { background: rgba(79,110,247,0.10); }
    .calendar-day.today .calendar-day-number { background: var(--color-primary); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
    .calendar-day.other-month { opacity: 0.35; }
    .calendar-day.sun .calendar-day-number { color: #F07070; }
    .calendar-day.sat .calendar-day-number { color: #7B9BFA; }
    .calendar-day-number { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
    .calendar-day-events { display: flex; flex-direction: column; gap: 2px; }
    .calendar-event {
      background: var(--event-color, var(--color-primary)); color: #fff; font-size: 11px;
      padding: 2px 6px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; cursor: pointer; transition: opacity 0.15s, box-shadow 0.15s; line-height: 1.4;
    }
    .calendar-event:hover { opacity: 0.85; box-shadow: 0 2px 8px rgba(17,24,28,0.10); }
    .calendar-event-more { font-size: 10px; color: var(--color-text-muted); padding: 1px 4px; }

    /* 상세 팝오버 (읽기 전용) */
    .popover-overlay {
      position: fixed; inset: 0; background: rgba(17,24,28,0.32);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .popover {
      background: var(--color-bg-primary); border-radius: 16px; box-shadow: var(--shadow-lg);
      max-width: 380px; width: 90%; padding: 22px; position: relative;
    }
    .popover-close {
      position: absolute; top: 14px; right: 14px; border: none; background: none;
      font-size: 20px; color: var(--color-text-hint); cursor: pointer; line-height: 1;
    }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
    .pop-meta { font-size: 13px; color: var(--color-text-secondary); display: flex; flex-direction: column; gap: 8px; background: var(--color-bg-secondary); padding: 12px 14px; border-radius: 10px; }
    .pop-meta .k { color: var(--color-text-hint); margin-right: 6px; }

    /* 상태 표시 */
    .state-box { text-align: center; padding: 60px 20px; color: var(--color-text-muted); font-size: 14px; }
    .updated { font-size: 11px; color: var(--color-text-hint); margin-top: 8px; text-align: right; }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .calendar-day { min-height: 76px; padding: 4px 5px; }
      .calendar-day-number { font-size: 12px; }
      .calendar-event { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div>
        <div class="page-title"><span class="accent">VIRNECT</span> 마케팅팀 캘린더</div>
        <div class="page-sub">마케팅팀이 등록한 공개 일정입니다 · 읽기 전용</div>
      </div>
      <span class="live-badge"><span class="live-dot"></span>실시간 공유</span>
    </div>

    <div class="cal-nav">
      <div class="cal-nav-left">
        <button class="nav-btn" id="prev" aria-label="이전 달">&lt;</button>
        <span class="cal-nav-title" id="title"></span>
        <button class="nav-btn" id="next" aria-label="다음 달">&gt;</button>
        <button class="nav-btn today-btn" id="today">오늘</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div id="cal"></div>
    <div class="updated" id="updated"></div>
  </div>

  <script>
    // 외부 공개 캘린더 — 인증 없이 /task/api/public/* 만 호출하는 읽기 전용 뷰.
    const API_BASE = '/task/api/public';
    const FALLBACK_COLORS = { general:'#4F6EF7', meeting:'#7B9BFA', deadline:'#F07070', campaign:'#5DD984', event:'#F5A623', holiday:'#9A9BA3' };
    const FALLBACK_LABELS = { general:'일반', meeting:'회의', deadline:'마감', campaign:'캠페인', event:'행사', holiday:'휴일' };

    const state = {
      year: new Date().getFullYear(),
      month: new Date().getMonth(), // 0-based
      events: [],
      colors: { ...FALLBACK_COLORS },
      labels: { ...FALLBACK_LABELS },
    };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function ymd(v) { return v ? String(v).slice(0, 10) : ''; }
    function hhmm(v) { return v ? String(v).slice(0, 5) : ''; }
    function toDateStr(d) {
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    async function loadEventTypes() {
      try {
        const res = await fetch(`${API_BASE}/event-types`);
        const json = await res.json();
        const types = json.data || [];
        if (types.length) {
          state.colors = {}; state.labels = {};
          types.forEach(t => { state.colors[t.type_key] = t.color; state.labels[t.type_key] = t.label; });
        }
      } catch { /* 폴백 유지 */ }
    }

    async function loadEvents() {
      const month = `${state.year}-${String(state.month + 1).padStart(2, '0')}`;
      try {
        const res = await fetch(`${API_BASE}/calendar?month=${month}`);
        const json = await res.json();
        state.events = json.data || [];
        return true;
      } catch {
        state.events = [];
        return false;
      }
    }

    function eventsForDate(dateStr) {
      return state.events.filter(ev => {
        const start = ymd(ev.start_date);
        const end = ymd(ev.end_date) || start;
        return dateStr >= start && dateStr <= end;
      });
    }

    function renderLegend() {
      const el = document.getElementById('legend');
      el.innerHTML = Object.entries(state.labels).map(([k, v]) =>
        `<span class="legend-item"><span class="legend-dot" style="background:${state.colors[k] || FALLBACK_COLORS.general}"></span>${esc(v)}</span>`
      ).join('');
    }

    function render() {
      const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
      const dayNames = ['일','월','화','수','목','금','토'];
      document.getElementById('title').textContent = `${state.year}년 ${monthNames[state.month]}`;

      const today = new Date(); today.setHours(0,0,0,0);
      const firstDay = new Date(state.year, state.month, 1);
      const lastDay = new Date(state.year, state.month + 1, 0);
      const startDow = firstDay.getDay();
      const prevLast = new Date(state.year, state.month, 0);

      const cells = [];
      for (let i = startDow - 1; i >= 0; i--) cells.push({ date: new Date(state.year, state.month - 1, prevLast.getDate() - i), other: true });
      for (let d = 1; d <= lastDay.getDate(); d++) cells.push({ date: new Date(state.year, state.month, d), other: false });
      const remaining = 42 - cells.length;
      for (let d = 1; d <= remaining; d++) cells.push({ date: new Date(state.year, state.month + 1, d), other: true });

      let html = '<div class="calendar-grid"><div class="calendar-header">';
      dayNames.forEach((n, i) => {
        const cls = i === 0 ? ' sun' : i === 6 ? ' sat' : '';
        html += `<div class="calendar-header-cell${cls}">${n}</div>`;
      });
      html += '</div><div class="calendar-body">';

      for (let w = 0; w < 6; w++) {
        html += '<div class="calendar-week">';
        for (let d = 0; d < 7; d++) {
          const cell = cells[w * 7 + d];
          const dateStr = toDateStr(cell.date);
          let cls = 'calendar-day';
          if (cell.other) cls += ' other-month';
          if (cell.date.getTime() === today.getTime()) cls += ' today';
          if (d === 0) cls += ' sun';
          if (d === 6) cls += ' sat';

          const dayEvents = eventsForDate(dateStr);
          html += `<div class="${cls}"><div class="calendar-day-number">${cell.date.getDate()}</div><div class="calendar-day-events">`;
          dayEvents.slice(0, 3).forEach(ev => {
            const color = ev.color || state.colors[ev.event_type] || FALLBACK_COLORS.general;
            html += `<div class="calendar-event" data-id="${ev.id}" style="--event-color:${esc(color)};" title="${esc(ev.title)}">${esc(ev.title)}</div>`;
          });
          if (dayEvents.length > 3) html += `<div class="calendar-event-more">+${dayEvents.length - 3}개</div>`;
          html += '</div></div>';
        }
        html += '</div>';
      }
      html += '</div></div>';

      document.getElementById('cal').innerHTML = html;

      document.querySelectorAll('.calendar-event[data-id]').forEach(pill => {
        pill.addEventListener('click', () => {
          const ev = state.events.find(e => String(e.id) === pill.dataset.id);
          if (ev) showPopover(ev);
        });
      });
    }

    function showPopover(ev) {
      document.querySelector('.popover-overlay')?.remove();
      const typeLabel = state.labels[ev.event_type] || ev.event_type || '';
      const color = ev.color || state.colors[ev.event_type] || FALLBACK_COLORS.general;
      const sDate = ymd(ev.start_date), eDate = ymd(ev.end_date);
      const dateRange = eDate && eDate !== sDate ? `${sDate} ~ ${eDate}` : sDate;
      const timeRange = !ev.all_day && ev.start_time
        ? `${hhmm(ev.start_time)}${ev.end_time ? ' ~ ' + hhmm(ev.end_time) : ''}` : '종일';

      const overlay = document.createElement('div');
      overlay.className = 'popover-overlay';
      overlay.innerHTML = `
        <div class="popover">
          <button class="popover-close" aria-label="닫기">×</button>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-right:24px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${esc(color)};flex-shrink:0;"></span>
            <span style="font-size:17px;font-weight:700;letter-spacing:-0.02em;line-height:1.3;">${esc(ev.title)}</span>
          </div>
          <div style="margin-bottom:14px;"><span class="badge" style="background:${esc(color)}22;color:${esc(color)};">${esc(typeLabel)}</span></div>
          ${ev.description ? `<div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.55;white-space:pre-wrap;">${esc(ev.description)}</div>` : ''}
          <div class="pop-meta">
            <div><span class="k">📅</span> ${esc(dateRange || '-')}</div>
            <div><span class="k">🕐</span> ${esc(timeRange)}</div>
            ${ev.assignee_name ? `<div><span class="k">👤</span> ${esc(ev.assignee_name)}</div>` : ''}
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('.popover-close').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    }

    function markUpdated() {
      const t = new Date();
      document.getElementById('updated').textContent =
        `마지막 동기화 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    }

    async function refresh() {
      const ok = await loadEvents();
      render();
      if (ok) markUpdated();
    }

    // 네비게이션
    document.getElementById('prev').addEventListener('click', () => {
      state.month--; if (state.month < 0) { state.month = 11; state.year--; }
      refresh();
    });
    document.getElementById('next').addEventListener('click', () => {
      state.month++; if (state.month > 11) { state.month = 0; state.year++; }
      refresh();
    });
    document.getElementById('today').addEventListener('click', () => {
      const now = new Date(); state.year = now.getFullYear(); state.month = now.getMonth();
      refresh();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelector('.popover-overlay')?.remove();
    });

    // 초기 로드
    (async () => {
      document.getElementById('cal').innerHTML = '<div class="state-box">불러오는 중...</div>';
      await loadEventTypes();
      renderLegend();
      await refresh();
    })();

    // 실시간 연동 — 60초 주기 폴링 + 탭 복귀 시 즉시 갱신
    setInterval(() => { if (!document.hidden) refresh(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
