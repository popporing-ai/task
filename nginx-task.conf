server {
    listen 80;
    server_name marketing.virnect.local;

    location /ip/ {
        proxy_pass http://ipmanager:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /crm/api/ {
        proxy_pass http://crm-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location /crm/ {
        proxy_pass http://crm-frontend:80/crm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auto-content/api/ {
        proxy_pass http://auto-content-backend:3003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /assets/ {
        proxy_pass http://auto-content-frontend:80/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auto-content/ {
        proxy_pass http://auto-content-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /task/ {
        proxy_pass http://task-task-1:3004/task/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 200 'Marketing Server Ready';
        add_header Content-Type text/plain;
    }
}
